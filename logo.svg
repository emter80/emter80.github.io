<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 78.62 42.64" role="img" aria-label="Logo">
  <title>Logo</title>
  <defs>
    <!-- each triangle is cut by a thin slit parallel to the side facing its neighbour, and a smaller
         triangle (same orientation) is cut out next to the slit; the green one is the gold turned 180 deg -->
    <mask id="cuts" maskUnits="userSpaceOnUse" x="0" y="0" width="78.62" height="42.64">
      <rect width="78.62" height="42.64" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width=".8" stroke-linejoin="round">
        <polygon points="12.83,33.54 33.9,33.54 23.36,15.3"/>
        <polygon points="65.79,9.1 44.73,9.1 55.26,27.34"/>
      </g>
      <g fill="#000">
        <polygon points="58.63,76.38 18.63,7.1 20.54,6 60.54,75.28"/>
        <polygon points="19.99,-33.74 59.99,35.54 58.09,36.64 18.09,-32.64"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#cuts)">
    <polygon points="24,4 4,38.64 44,38.64" fill="#E6B75A" stroke="#E6B75A" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="54.62,38.64 74.62,4 34.62,4" fill="#10B981" stroke="#10B981" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>